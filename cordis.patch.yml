# dsh-translator bundle patch
#
# Applied when the profile lists this bundle (dsh.bundle.patch). Installed via:
#
#   dsh plugin --profile <name> add @tuweizhi/dsh-translator
#   （或直接从本 fork 的仓库装：dsh plugin --profile <name> add github:TuWeiZhi/dsh-translator）
- insert:
    - id: dsh-translator
      name: '@tuweizhi/dsh-translator'
